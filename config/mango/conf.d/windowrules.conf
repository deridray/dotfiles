# Tag rules
tagrule=id:1,layout_name:monocle
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:monocle

# Opacity rules
windowrule=appid:Alacritty,focused_opacity:0.80
windowrule=appid:Alacritty,unfocused_opacity:0.80

windowrule=appid:kitty,focused_opacity:0.80
windowrule=appid:kitty,unfocused_opacity:0.80

windowrule=appid:thunar,focused_opacity:0.80
windowrule=appid:thunar,unfocused_opacity:0.80

windowrule=appid:obsidian,focused_opacity:0.80
windowrule=appid:obsidian,unfocused_opacity:0.80

windowrule=appid:spotify,focused_opacity:0.80
windowrule=appid:spotify,unfocused_opacity:0.80

windowrule=appid:discord,focused_opacity:0.80
windowrule=appid:discord,unfocused_opacity:0.80

windowrule=appid:vesktop,focused_opacity:0.80
windowrule=appid:vesktop,unfocused_opacity:0.80

windowrule=appid:org.telegram.desktop,focused_opacity:0.80
windowrule=appid:org.telegram.desktop,unfocused_opacity:0.80

windowrule=appid:com.ayugram.desktop,focused_opacity:0.80
windowrule=appid:com.ayugram.desktop,unfocused_opacity:0.80

windowrule=appid:steam,focused_opacity:0.80
windowrule=appid:steam,unfocused_opacity:0.80

windowrule=appid:Rofi,focused_opacity:0.80
windowrule=appid:Rofi,unfocused_opacity:0.80

windowrule=appid:swaync,focused_opacity:0.80
windowrule=appid:swaync,unfocused_opacity:0.80

windowrule=appid:better_control.py,focused_opacity:0.80
windowrule=appid:better_control.py,unfocused_opacity:0.80


# Layerrules
# Rofi launcher with zoom animation
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi

# Waybar with slide animation
layerrule=animation_type_open:slide,layer_name:waybar
layerrule=animation_type_close:slide,layer_name:waybar

# Notification daemon
layerrule=animation_type_open:slide,layer_name:swaync
layerrule=animation_type_close:slide,layer_name:swaync

# ==========================================
# WORKSPACE & PERFORMANCE TARGETS (TAGS)
# ==========================================

# osu! & neomodnet (Immediate Tearing + Workspace 6)
windowrule=force_tearing:1,appid:osu!.exe
windowrule=force_tearing:1,appid:net.neomodnet.neomod
windowrule=force_tearing:1,appid:gamescope
windowrule=force_tearing:1,appid:Gamescope


# ==========================================
# FLOATING & UTILITY WINDOW RULES
# ==========================================

# Simple Floating Tools
windowrule=isfloating:1,appid:org.pulseaudio.pavucontrol
windowrule=isfloating:1,appid:better_control.py
windowrule=isfloating:1,appid:waypaper
windowrule=isfloating:1,appid:org.twosheds.iwgtk
windowrule=isfloating:1,appid:galculator
windowrule=isfloating:1,appid:OpenTabletDriver.UX

# Ripdrag (Float + Sticky/Pin)
windowrule=isfloating:1,isglobal:1,appid:ripdrag

# GParted & Blueman (Float + Defined Center Sizes)
windowrule=isfloating:1,width:652,height:431,appid:GParted
windowrule=isfloating:1,width:530,height:313,appid:blueman-manager

# qBittorrent rules
windowrule=isfloating:1,width:650,height:450,appid:org.qbittorrent.qBittorrent
windowrule=isfloating:0,appid:org.qbittorrent.qBittorrent,title:qBittorrent v


# ==========================================
# COMPLEX APP OVERRIDES (STEAM & MPV)
# ==========================================

# MPV Video Player
windowrule=isfloating:1,opaque:1,width:1100,height:600,appid:mpv
windowrule=isfloating:1,opaque:1,width:1100,height:600,appid:feh
# windowrule=isfloating:1,opaque:1,width:1100,height:600,appid:qimgv

# Prism Launcher Console Logs
windowrule=isfloating:1,opaque:1,width:1100,height:600,appid:org.prismlauncher.PrismLauncher,title:Console window

# Steam Windows Mapping
windowrule=isfloating:1,width:460,height:580,appid:steam,title:Friends List
windowrule=isfloating:1,width:1100,height:600,appid:steam,title:Steam Settings
windowrule=isfloating:1,appid:steam,title:Special Offers


# ==========================================
# SYSTEM DIALOGS & PICTURE-IN-PICTURE
# ==========================================

# Picture-in-Picture Mode
windowrule=isfloating:1,isglobal:1,opaque:1,width:645,height:363,title:Picture-in-Picture
windowrule=isfloating:1,isglobal:1,opaque:1,width:645,height:363,title:picture-in-picture

# Native GTK & XDG Desktop Portals / File Selection Dialogs
windowrule=isfloating:1,appid:org.gnome.FileRoller
windowrule=isfloating:1,appid:xdg-desktop-portal-gtk
windowrule=isfloating:1,width:816,height:537,appid:dialog
windowrule=isfloating:1,title:Open File
windowrule=isfloating:1,title:Select a File
windowrule=isfloating:1,title:Choose wallpaper
windowrule=isfloating:1,title:Save As

# Other Window Rules
windowrule=isfloating:1,width:700,height:400,appid:floatterm
windowrule=animation_type_open:zoom,animation_type_close:zoom,appid:floatterm
windowrule=animation_type_open:zoom,animation_type_close:zoom,appid:mpv